<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vixcord — MockAPI</title>
  <style>
    :root{--red:#df4149;--deep:#1e1f22;--side:#292a2e;--bg:#313338;--input:#3d3f45;--text:#f2f3f5;--muted:#b5bac1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font:15px system-ui,sans-serif}.app{height:100%;display:grid;grid-template-columns:72px 238px minmax(0,1fr) 220px}.rail{background:var(--deep);display:flex;justify-content:center;padding:12px}.brand{height:48px;width:48px;border-radius:16px;background:var(--red);display:grid;place-items:center;font-size:20px;font-weight:900}.channels,.members{background:var(--side)}.channels{position:relative}.server{height:49px;padding:14px 16px;font-weight:800;border-bottom:1px solid #1e1f22}.section{padding:18px 9px 4px;font-size:11px;font-weight:800;color:var(--muted)}.channel{display:block;width:calc(100% - 16px);margin:1px 8px;border:0;border-radius:4px;padding:8px;text-align:left;background:transparent;color:var(--muted);cursor:pointer}.channel:hover,.channel.active{background:#404249;color:#fff}.channel b{font-size:18px;font-weight:400;margin-right:8px}.lock{float:right;font-size:12px;margin-top:3px}.profile{position:absolute;bottom:0;width:238px;padding:8px;background:#232428;display:flex;gap:8px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff7180,#8e1632);display:grid;place-items:center;font-weight:800;flex:none}.profile small{display:block;color:var(--muted)}.settings,.logout{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}.settings{margin-left:auto}.chat{display:flex;min-width:0;min-height:0;flex-direction:column}header{height:49px;flex:none;padding:0 16px;border-bottom:1px solid #202125;display:flex;align-items:center;gap:10px;font-weight:800}header span{font-size:21px;color:var(--muted)}header small{padding-left:10px;border-left:1px solid #505259;color:var(--muted);font-weight:400}.messages{min-height:0;padding:18px;overflow-y:auto;overflow-x:hidden;flex:1}.welcome{border-bottom:1px solid #44464d;padding-bottom:20px;margin-bottom:16px}.circle{height:68px;width:68px;border-radius:50%;background:#45474e;display:grid;place-items:center;font-size:38px}h1{margin:10px 0 3px;font-size:28px}.welcome p{color:var(--muted);margin:0}.message{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:6px 0 14px}.message .avatar{width:40px;height:40px}.meta{font-weight:800}.meta time{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}.content,.reply{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.content{color:#dcdee1}.reply{font-size:12px;color:#b9c1ff;margin-bottom:4px;padding-left:8px;border-left:2px solid #6063a9}.replybtn{border:0;background:transparent;color:var(--muted);font-size:12px;padding:0;margin-top:4px;cursor:pointer}.composer{flex:none;display:flex;align-items:center;gap:9px;background:var(--input);margin:0 16px 20px;padding:0 13px;border-radius:8px}.composer span{font-size:23px;color:var(--muted)}input{flex:1;min-width:0;padding:13px 0;border:0;outline:0;background:transparent;color:#fff;font:inherit}.send,.join{border:0;border-radius:5px;background:var(--red);color:#fff;font-weight:800;padding:8px 12px;cursor:pointer}.disabled{opacity:.55;pointer-events:none}.members{padding:20px 12px}.members h2{font-size:12px;color:var(--muted)}.member{display:flex;align-items:center;gap:9px;padding:6px;color:var(--muted)}.member .avatar{width:32px;height:32px;font-size:12px}.dot{width:10px;height:10px;border:2px solid var(--side);border-radius:50%;margin-left:-17px;margin-top:22px;background:#747f8d}.dot.on{background:#23a55a}.auth,.modal{position:fixed;inset:0;z-index:2;background:#202126;display:grid;place-items:center}.modal{display:none;background:#0008;z-index:3}.card{width:min(420px,calc(100% - 32px));padding:32px;border-radius:12px;text-align:center;background:#313338;box-shadow:0 20px 50px #0008}.modal .card{text-align:left}.logo{font-size:30px;font-weight:900}.logo i{color:var(--red);font-style:normal}.card p{color:var(--muted)}.card input{display:block;width:100%;padding:12px;margin:12px 0;background:#1e1f22;border:1px solid #555861;border-radius:5px}.card input[type=color]{height:42px;padding:4px}.card label{display:block;color:var(--muted);font-size:13px;margin-top:12px}.card .join{width:100%;padding:12px}.switch{border:0;background:transparent;color:#aab5ff;cursor:pointer;margin-top:11px}.notice{font-size:12px;color:#ffb4b6;min-height:18px}.replybar{display:none;flex:none;margin:0 16px;padding:7px 12px;background:#292a2e;color:var(--muted);font-size:12px}.replybar button{float:right;border:0;background:transparent;color:#fff;cursor:pointer}@media(max-width:800px){.app{grid-template-columns:62px 200px minmax(0,1fr)}.members{display:none}.profile{width:200px}}@media(max-width:550px){.app{grid-template-columns:58px minmax(0,1fr)}.channels{display:none}}
  </style>
</head>
<body>
  <div class="auth" id="auth"><div class="card"><div class="logo">Vix<i>cord</i></div><h1 id="authTitle">Welcome back</h1><p id="authCopy">Sign in to Vixel Main.</p><input id="username" maxlength="24" placeholder="Username" autocomplete="username"><input id="password" type="password" minlength="4" placeholder="Password" autocomplete="current-password"><p class="notice" id="notice"></p><button class="join" id="authButton">Sign in</button><button class="switch" id="switch">Need an account? Create one</button></div></div>
  <main class="app"><aside class="rail"><div class="brand">V</div></aside><aside class="channels"><div class="server">Vixel Main⌄</div><div class="section">TEXT CHANNELS</div><button class="channel active" data-chat="chat1" data-name="general"><b>#</b>general</button><button class="channel" data-chat="chat2" data-name="other"><b>#</b>other</button><button class="channel" data-chat="chat3" data-name="announcements"><b>#</b>announcements</button><button class="channel staff-only" data-chat="chat4" data-name="staff-chat"><b>#</b>staff-chat <span class="lock">🔒</span></button><div class="profile"><div class="avatar" id="myAvatar">?</div><div><strong id="myName">Not signed in</strong><small id="myRank">—</small></div><button class="settings" id="settings" title="Settings">⚙</button><button class="logout" id="logout" title="Sign out">⎋</button></div></aside><section class="chat"><header><span>#</span><b id="title">general</b><small id="topic">Talk with everyone in Vixel Main</small></header><div class="messages" id="messages"></div><div class="replybar" id="replybar">Replying to <b id="replyto"></b><button id="cancelReply">Cancel</button></div><form class="composer" id="composer"><span>＋</span><input id="text" autocomplete="off" placeholder="Message #general"><button class="send">Send</button></form></section><aside class="members"><h2 id="count">MEMBERS — 0</h2><div id="members"></div></aside></main>
  <div class="modal" id="settingsModal"><section class="card"><h1>Appearance settings</h1><p>Change your name color and your own Vixcord background colors.</p><label for="nameColor">Name color</label><input id="nameColor" type="color"><label for="deepColor">Server rail background</label><input id="deepColor" type="color"><label for="sideColor">Sidebar background</label><input id="sideColor" type="color"><label for="chatColor">Chat background</label><input id="chatColor" type="color"><p class="notice" id="settingsNotice"></p><button class="join" id="saveSettings">Save changes</button><button class="switch" id="closeSettings">Cancel</button></section></div>
<script>
const API={users:'https://6a638812b30b52361e1a6b8d.mockapi.io/1/users',logins:'https://6a638812b30b52361e1a6b8d.mockapi.io/1/logins',chat1:'https://6a63dbd7b30b52361e1aab35.mockapi.io/2/chat1',chat2:'https://6a63dbd7b30b52361e1aab35.mockapi.io/2/chat2',chat3:'https://6a63dd06b30b52361e1aabe1.mockapi.io/3/chat3',chat4:'https://6a63dd06b30b52361e1aabe1.mockapi.io/3/chat4'};
const $=s=>document.querySelector(s),sessionKey='vixcord-mockapi-user';let me=null,chat='chat1',chatName='general',reply=null,isSignup=false;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const initials=n=>String(n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();const isStaff=()=>['staff','owner'].includes(String(me?.rank||'').toLowerCase());const color=(v,fallback)=>/^#[0-9a-f]{6}$/i.test(v||'')?v:fallback;
async function request(url,opts={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});if(!r.ok)throw Error(`API error (${r.status})`);return r.status===204?null:r.json()}async function hashPassword(password,salt){let bytes=new TextEncoder().encode(salt+'|'+password),out=await crypto.subtle.digest('SHA-256',bytes);return btoa(String.fromCharCode(...new Uint8Array(out)))}function newSalt(){return crypto.getRandomValues(new Uint32Array(4)).join('-')}
function setNotice(text=''){$('#notice').textContent=text}function authMode(){let action=isSignup?'Create account':'Sign in';$('#authTitle').textContent=isSignup?'Join Vixel Main':'Welcome back';$('#authCopy').textContent=isSignup?'Your password is stored as a one-way hash, never raw text.':'Sign in to Vixel Main.';$('#authButton').textContent=action;$('#switch').textContent=isSignup?'Already have an account? Sign in':'Need an account? Create one';$('#password').autocomplete=isSignup?'new-password':'current-password';setNotice()}
async function submitAuth(){let username=$('#username').value.trim(),password=$('#password').value;if(!username||password.length<4)return setNotice('Use a username and a password of at least 4 characters.');try{let [users,logins]=await Promise.all([request(API.users),request(API.logins)]),existing=users.find(u=>String(u.username).toLowerCase()===username.toLowerCase());if(isSignup){if(existing)return setNotice('That username is already taken.');let user=await request(API.users,{method:'POST',body:JSON.stringify({username,online:true,namecolor:'#f2f3f5',rank:'member',deepcolor:'#1e1f22',sidecolor:'#292a2e',chatcolor:'#313338'})}),salt=newSalt(),passwordHash=await hashPassword(password,salt);await request(API.logins,{method:'POST',body:JSON.stringify({username,password:`sha256$${salt}$${passwordHash}`})});finish(user)}else{let login=logins.find(x=>String(x.username).toLowerCase()===username.toLowerCase());if(!existing||!login)return setNotice('Username or password is incorrect.');let [,salt,hash]=String(login.password||'').split('$');if(!salt||await hashPassword(password,salt)!==hash)return setNotice('Username or password is incorrect.');finish(await request(API.users+'/'+existing.id,{method:'PUT',body:JSON.stringify({online:true})}))}}catch(e){setNotice(e.message+' Check the API URLs and your connection.')}}
function applyTheme(){document.documentElement.style.setProperty('--deep',color(me?.deepcolor,'#1e1f22'));document.documentElement.style.setProperty('--side',color(me?.sidecolor,'#292a2e'));document.documentElement.style.setProperty('--bg',color(me?.chatcolor,'#313338'))}function syncChannels(){document.querySelector('.staff-only').style.display=isStaff()?'block':'none';if(!isStaff()&&chat==='chat4')choose(document.querySelector('[data-chat="chat1"]'))}
function finish(user){me=user;localStorage.setItem(sessionKey,JSON.stringify(user));$('#auth').style.display='none';$('#myAvatar').textContent=initials(me.username);$('#myName').textContent=me.username;$('#myName').style.color=color(me.namecolor,'#fff');$('#myRank').textContent=me.rank||'member';applyTheme();syncChannels();loadUsers();loadMessages()}
async function loadUsers(){try{let users=await request(API.users);$('#count').textContent=`MEMBERS — ${users.length}`;$('#members').innerHTML=users.sort((a,b)=>Boolean(b.online)-Boolean(a.online)).map(u=>`<div class="member"><div class="avatar">${esc(initials(u.username))}</div><i class="dot ${u.online?'on':''}"></i><span style="color:${color(u.namecolor,'inherit')}">${esc(u.username)}${u.rank&&u.rank!=='member'?` <small>(${esc(u.rank)})</small>`:''}</span></div>`).join('')}catch(e){console.warn(e)}}
function canPost(){return chat!=='chat3'&&chat!=='chat4'||isStaff()}function replyText(value){if(!value)return'';if(typeof value==='string')return value;return `${value.username||'Unknown'}: ${value.message||''}`}async function loadMessages(){try{let data=await request(API[chat]);renderMessages(data)}catch(e){$('#messages').innerHTML=`<p class="notice">${esc(e.message)}. The chat could not load.</p>`}}
function renderMessages(data){let sorted=[...data].sort((a,b)=>new Date(a.time||a.createdAt||0)-new Date(b.time||b.createdAt||0)),locked=!canPost(),desc=chat==='chat3'?'Only staff and owners can post announcements.':chat==='chat4'?'Staff-only discussion.':'This chat is saved in MockAPI.';$('#messages').innerHTML=`<div class="welcome"><div class="circle">${chat==='chat3'?'📣':chat==='chat4'?'🔒':'#'}</div><h1>Welcome to #${esc(chatName)}!</h1><p>${desc}</p></div>`+sorted.map(m=>`<article class="message"><div class="avatar">${esc(initials(m.username))}</div><div><div class="meta">${esc(m.username||'Unknown')}<time>${esc(m.time||m.createdAt||'')}</time></div>${m.reply?`<div class="reply">↪ ${esc(replyText(m.reply))}</div>`:''}<div class="content">${esc(m.messeges??m.messages??'')}</div><button class="replybtn" data-user="${esc(m.username||'Unknown')}" data-message="${esc(m.messeges??m.messages??'')}">Reply</button></div></article>`).join('');$('#composer').classList.toggle('disabled',locked);$('#text').placeholder=locked?'Only staff or owners can post here':`Message #${chatName}`;$('#messages').querySelectorAll('.replybtn').forEach(b=>b.onclick=()=>{reply={username:b.dataset.user,message:b.dataset.message};$('#replyto').textContent=replyText(reply);$('#replybar').style.display='block';$('#text').focus()});$('#messages').scrollTop=$('#messages').scrollHeight}
function choose(button){chat=button.dataset.chat;chatName=button.dataset.name;$('#title').textContent=chatName;document.querySelectorAll('.channel').forEach(x=>x.classList.toggle('active',x===button));reply=null;$('#replybar').style.display='none';loadMessages()}
function settingsOpen(){if(!me)return;$('#nameColor').value=color(me.namecolor,'#f2f3f5');$('#deepColor').value=color(me.deepcolor,'#1e1f22');$('#sideColor').value=color(me.sidecolor,'#292a2e');$('#chatColor').value=color(me.chatcolor,'#313338');$('#settingsNotice').textContent='';$('#settingsModal').style.display='grid'}
async function settingsSave(){try{me=await request(API.users+'/'+me.id,{method:'PUT',body:JSON.stringify({namecolor:$('#nameColor').value,deepcolor:$('#deepColor').value,sidecolor:$('#sideColor').value,chatcolor:$('#chatColor').value})});localStorage.setItem(sessionKey,JSON.stringify(me));$('#myName').style.color=me.namecolor;applyTheme();$('#settingsModal').style.display='none';loadUsers()}catch(e){$('#settingsNotice').textContent=e.message}}
$('#authButton').onclick=submitAuth;$('#switch').onclick=()=>{isSignup=!isSignup;authMode()};$('#password').onkeydown=e=>{if(e.key==='Enter')submitAuth()};document.querySelectorAll('.channel').forEach(b=>b.onclick=()=>choose(b));$('#cancelReply').onclick=()=>{reply=null;$('#replybar').style.display='none'};$('#composer').onsubmit=async e=>{e.preventDefault();let messeges=$('#text').value.trim();if(!messeges||!me||!canPost())return;try{await request(API[chat],{method:'POST',body:JSON.stringify({messeges,time:new Date().toLocaleString(),username:me.username,reply})});$('#text').value='';reply=null;$('#replybar').style.display='none';loadMessages()}catch(e){alert(e.message)}};$('#settings').onclick=settingsOpen;$('#closeSettings').onclick=()=>$('#settingsModal').style.display='none';$('#saveSettings').onclick=settingsSave;$('#logout').onclick=async()=>{if(me)try{await request(API.users+'/'+me.id,{method:'PUT',body:JSON.stringify({online:false})})}catch{}localStorage.removeItem(sessionKey);location.reload()};addEventListener('beforeunload',()=>{if(me)fetch(API.users+'/'+me.id,{method:'PUT',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({online:false})})});(async()=>{let saved=JSON.parse(localStorage.getItem(sessionKey)||'null');if(saved){try{finish(await request(API.users+'/'+saved.id,{method:'PUT',body:JSON.stringify({online:true})}))}catch{localStorage.removeItem(sessionKey)}}authMode()})();setInterval(()=>{if(me)loadMessages()},10000);setInterval(()=>{if(me)loadUsers()},1000);
</script></body></html>
